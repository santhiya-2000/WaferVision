# WaferVision Configuration File
# Default settings for semiconductor inspection

# Image Processing
image.denoise_strength = 10
image.enhance_contrast = true
image.sharpen = false

# GPU Acceleration
gpu.enabled = false
gpu.device_id = 0

# Wafer Alignment
alignment.method = HYBRID
alignment.expected_diameter = 300.0
alignment.tolerance = 5.0

# Defect Detection
defect.sensitivity = 0.5
defect.min_defect_size = 5.0
defect.max_defect_size = 1000.0
defect.use_edge_reduction = true
defect.use_pattern_processing = true
defect.edge_threshold = 50.0
defect.pattern_match_threshold = 0.8

# Metrology
metrology.calibration_factor = 1.0
metrology.measurement_tolerance = 0.01

# Logging
log.level = INFO
log.console_output = true
log.file_output = false
log.file_path = wafervision.log

# Output
output.save_processed = true
output.save_defect_map = true
output.save_report = true
output.format = png
